name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Production build
        run: npm run build
      - name: Install Playwright for temporary visual QA
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/tisee-next.log 2>&1 &
          echo $! > /tmp/tisee-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tisee-next.log
          exit 1
      - name: Browser visual QA
        run: node scripts/ci-visual.mjs
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/tisee-next.pid ]; then kill "$(cat /tmp/tisee-next.pid)" || true; fi
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-final-visual-qa
          path: artifacts/visual-qa
          if-no-files-found: ignore
