name: Refresh resume once

on:
  push:
    branches:
      - fix/tisee-feedback-round-2
    paths:
      - .github/workflows/refresh-resume-once.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tisee-feedback-round-2
          fetch-depth: 0

      - name: Download exact uploaded resume
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-5e60-81fb-b041-fc9e6b497edd/raw?se=2026-08-31T11%3A04%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=7d156c79-f852-598b-9098-3bc2b7386695&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T03%3A53%3A47Z&ske=2026-09-01T03%3A53%3A47Z&sks=b&skv=2026-02-06&sig=35%2BXdHnXXXw%2Bq9/iUbJvTjw7oRaYvNHauZF2p0HS47Q%3D' -o public/resume.pdf
          echo '4c912dc9626c8e471313f83129cdf4cfd2af3c97ecb6c4389fe5c4da18b61344  public/resume.pdf' | sha256sum -c -

      - name: Update GPA only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          assert s.count('>3.64</div>') == 1, 'Expected exactly one GPA value 3.64'
          p.write_text(s.replace('>3.64</div>', '>3.66</div>', 1))
          PY

      - name: Commit exact changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tisee'
          git config user.email '117323499+Tisee747@users.noreply.github.com'
          git add -- public/resume.pdf src/app/page.tsx
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix: update resume and GPA to 3.66 [skip ci]'
          git push origin HEAD:fix/tisee-feedback-round-2
